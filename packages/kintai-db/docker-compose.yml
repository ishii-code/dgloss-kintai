# ローカル開発用 Postgres。`docker compose up -d` で起動。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kintai
      POSTGRES_PASSWORD: kintai
      POSTGRES_DB: kintai
    ports:
      - "5432:5432"
    volumes:
      - kintai-pgdata:/var/lib/postgresql/data
volumes:
  kintai-pgdata:
